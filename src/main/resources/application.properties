quarkus.application.name=project-uno-ingress
quarkus.jackson.fail-on-unknown-properties=true

quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# HTTP/2 lets clients multiplex many in-flight requests on one connection.
# A single source IP cannot open ~1e6 TCP connections (ephemeral ports top out near 64k).
quarkus.http.http2=true
quarkus.http.limits.max-concurrent-streams=1024
quarkus.http.limits.max-connections=1000000
quarkus.http.limits.max-body-size=512
quarkus.http.limits.max-header-size=8K
quarkus.http.accept-backlog=65535
quarkus.http.so-reuse-port=true
quarkus.http.idle-timeout=30s
quarkus.http.read-timeout=15s

# Prefer the Netty native transport when the shared library is present.
quarkus.vertx.prefer-native-transport=true

# Admission cap. The supported operating point is 1_000_000 concurrent API calls.
app.capacity.max-inflight=1000000

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.enabled=true

# JSON console is the logging-json default. Keep dev and test readable.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%X{correlationId}] (%t) %s%e%n
%test.quarkus.vertx.prefer-native-transport=false
